# Root module: inputs and outputs are published to docs/io.md, matching the
# CloudDrove house layout. README.md itself is rendered from README.yaml.
formatter: markdown table

output:
  file: docs/io.md
  mode: replace
  template: |-
    {{ .Content }}

sections:
  show:
    - inputs
    - outputs

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: true
  html: true
  indent: 2
  lockfile: false
  required: true
  sensitive: true
  type: true
